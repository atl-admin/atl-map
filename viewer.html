<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ATL Server Map</title>
<style>
:root{--bg:#14151a;--fg:#e6e8ee;--mut:#9aa0ae;--card:#1d1f27;--line:#2d303b;--acc:#6aa8ff}
@media (prefers-color-scheme:light){:root{--bg:#f4f5f8;--fg:#1c1e25;--mut:#5d6373;--card:#fff;--line:#d9dce4;--acc:#1f6feb}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line)}
h1{font-size:17px;margin:0;flex:1 1 auto}.meta{color:var(--mut);font-size:13px}
button,a.btn{font:inherit;padding:6px 12px;border-radius:8px;border:0;background:var(--acc);color:#fff;cursor:pointer;text-decoration:none}
#wrap{overflow:auto;height:calc(100vh - 56px);background:#0d0e12}
#wrap img{display:block;max-width:none;image-rendering:auto}
</style></head><body>
<header><h1>DaddyOmega Server Map</h1><span class="meta" id="meta">loading…</span>
<button id="out">−</button><button id="in">+</button><button id="fit">Fit</button><a class="btn" href="map.png" download>Download PNG</a></header>
<div id="wrap"><img id="img" alt="Server map" src="map.png"></div>
<script>
const img=document.getElementById('img'),wrap=document.getElementById('wrap');let z=1,natW=0;
const set=()=>{img.style.width=(natW*z)+'px'};
img.onload=()=>{natW=img.naturalWidth;z=Math.min(1,wrap.clientWidth/natW);set()};
document.getElementById('in').onclick=()=>{z=Math.min(4,z*1.25);set()};
document.getElementById('out').onclick=()=>{z=Math.max(.05,z/1.25);set()};
document.getElementById('fit').onclick=()=>{z=Math.min(wrap.clientWidth/natW,(wrap.clientHeight)/img.naturalHeight);set()};
fetch('map-info.json?'+Date.now()).then(r=>r.json()).then(j=>{document.getElementById('meta').textContent='Updated '+j.updatedUtc+' · '+j.chunks+' chunks · '+j.players+' online · '+j.areas+' areas'}).catch(()=>{document.getElementById('meta').textContent=''});
</script></body></html>
